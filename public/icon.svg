<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Islamic Pattern Octagon Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#047857" stroke-width="4" stroke-opacity="0.4" stroke-dasharray="12 8" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.3" />

  <!-- Crescent & Star Motif (Top Center) -->
  <g transform="translate(256, 120)" filter="url(#shadow)">
    <!-- Star -->
    <path d="M 0 -35 L 7 -18 L 25 -18 L 11 -6 L 16 11 L 0 0 L -16 11 L -11 -6 L -25 -18 L -7 -18 Z" fill="url(#goldGrad)" transform="scale(0.85)" />
    <!-- Crescent -->
    <path d="M 18 -15 A 32 32 0 1 0 18 35 A 25 25 0 1 1 18 -15 Z" fill="url(#goldGrad)" transform="translate(-18, -10)" />
  </g>

  <!-- Open Holy Book / Rihal Motif -->
  <g transform="translate(256, 285)" filter="url(#shadow)">
    <!-- Book Base / Stand Wooden Rihal -->
    <path d="M -130 90 L 0 25 L 130 90 L 95 105 L 0 55 L -95 105 Z" fill="#d97706" />

    <!-- Left Page -->
    <path d="M -10 15 C -60 -10 -110 -15 -170 5 C -170 5 -165 75 -165 75 C -110 55 -60 60 -10 85 Z" fill="url(#pageGrad)" stroke="#e7e5e4" stroke-width="2" />
    <!-- Right Page -->
    <path d="M 10 15 C 60 -10 110 -15 170 5 C 170 5 165 75 165 75 C 110 55 60 60 10 85 Z" fill="url(#pageGrad)" stroke="#e7e5e4" stroke-width="2" />

    <!-- Center Spine -->
    <path d="M -10 15 L 0 18 L 10 15 L 10 85 L 0 88 L -10 85 Z" fill="#b45309" />

    <!-- Gold Text Lines on Pages -->
    <!-- Left page lines -->
    <line x1="-140" y1="25" x2="-35" y2="35" stroke="#047857" stroke-width="4" stroke-linecap="round" stroke-opacity="0.7" />
    <line x1="-145" y1="42" x2="-35" y2="52" stroke="#047857" stroke-width="4" stroke-linecap="round" stroke-opacity="0.7" />
    <line x1="-140" y1="60" x2="-45" y2="68" stroke="#d97706" stroke-width="4" stroke-linecap="round" stroke-opacity="0.8" />

    <!-- Right page lines -->
    <line x1="35" y1="35" x2="140" y2="25" stroke="#047857" stroke-width="4" stroke-linecap="round" stroke-opacity="0.7" />
    <line x1="35" y1="52" x2="145" y2="42" stroke="#047857" stroke-width="4" stroke-linecap="round" stroke-opacity="0.7" />
    <line x1="45" y1="68" x2="140" y2="60" stroke="#d97706" stroke-width="4" stroke-linecap="round" stroke-opacity="0.8" />
  </g>

  <!-- Typography / Brand Label -->
  <text x="256" y="445" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="34" fill="#fbbf24" letter-spacing="4">AL-HIKMAH</text>
  <text x="256" y="475" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="20" fill="#a7f3d0">အစ္စလာမ်မီ ဒစ်ဂျစ်တယ် စာကြည့်တိုက်</text>
</svg>
